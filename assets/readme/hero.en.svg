<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d">
<title id="t">mituan Manuscript Tracker</title>
<desc id="d">Browser extension that checks manuscript status on journal and conference submission systems and notifies you when it changes. On the right, one manuscript moves from submitted to with editor, under review and revision, with a notification.</desc>
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d4ed8"/><stop offset=".6" stop-color="#0ea5e9"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <linearGradient id="word" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b82f6"/><stop offset=".55" stop-color="#0ea5e9"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <radialGradient id="g1" cx=".12" cy="0" r=".75"><stop offset="0" stop-color="#2563eb" stop-opacity=".32"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
  <radialGradient id="g2" cx="1" cy="1" r=".7"><stop offset="0" stop-color="#22d3ee" stop-opacity=".2"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#94b2ff" stroke-opacity=".055"/></pattern>
  <filter id="sh" x="-20%" y="-30%" width="140%" height="180%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".55"/></filter>
  <clipPath id="frame"><rect width="1200" height="440" rx="24"/></clipPath>
</defs>
<g clip-path="url(#frame)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif">
  <rect width="1200" height="440" fill="#070b14"/>
  <rect width="1200" height="440" fill="url(#g1)"/>
  <rect width="1200" height="440" fill="url(#g2)"/>
  <rect width="1200" height="440" fill="url(#grid)"/>

  <g transform="translate(64 56)">
    <rect width="52" height="52" rx="13" fill="url(#brand)"/>
    <g transform="scale(.8125)"><path d="M15 46V19h8.5L32 31.5 40.5 19H49v27" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 46v-9M40 46v-9" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3.2" stroke-linecap="round"/><circle cx="32" cy="44.5" r="3.4" fill="#fff"/></g>
  </g>
  <text x="130" y="94" font-size="34" font-weight="800" fill="url(#word)" letter-spacing="-.5">mituan</text>
  <rect x="262" y="68" width="2" height="30" rx="1" fill="#94b2ff" fill-opacity=".35"/>
  <text x="278" y="92" font-size="24" font-weight="700" fill="#e6edf7">Manuscript Tracker</text>

  <text x="64" y="208" font-size="56" font-weight="800" fill="#f8fafc" letter-spacing="-1">Every manuscript,</text><text x="64" y="270" font-size="56" font-weight="800" fill="#f8fafc" letter-spacing="-1">one tracker.</text>
  <text x="64" y="320" font-size="21" fill="#a5b4cf">Checks IEEE, Elsevier and other submission systems</text><text x="64" y="352" font-size="21" fill="#a5b4cf">in the background. Notifies you when a status changes.</text>
  <rect x="64" y="392" width="146" height="36" rx="18" fill="#7dd3fc" fill-opacity=".08" stroke="#7dd3fc" stroke-opacity=".35"/><text x="137.0" y="416" text-anchor="middle" font-size="18" font-weight="600" fill="#bae6fd">Edge / Chrome</text><rect x="220" y="392" width="196" height="36" rx="18" fill="#7dd3fc" fill-opacity=".08" stroke="#7dd3fc" stroke-opacity=".35"/><text x="318.0" y="416" text-anchor="middle" font-size="18" font-weight="600" fill="#bae6fd">Accounts stay local</text><rect x="426" y="392" width="124" height="36" rx="18" fill="#7dd3fc" fill-opacity=".08" stroke="#7dd3fc" stroke-opacity=".35"/><text x="488.0" y="416" text-anchor="middle" font-size="18" font-weight="600" fill="#bae6fd">Free to use</text>

  <g filter="url(#sh)">
    <rect x="714" y="40" width="424" height="282" rx="18" fill="#0e1524" stroke="#94b2ff" stroke-opacity=".18"/>
  </g>
  <text x="742" y="82" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" font-weight="700" fill="#7dd3fc">TPAMI-2026-03-0412</text>
  <text x="1110" y="82" text-anchor="end" font-size="18" fill="#93a2bd">IEEE TPAMI</text>
  <rect x="714" y="102" width="424" height="1" fill="#94b2ff" fill-opacity=".14"/>
  <rect x="754.5" y="142" width="3" height="138" fill="#94b2ff" fill-opacity=".22"/>
  <circle cx="756" cy="142" r="7" fill="#0e1524" stroke="#94a3b8" stroke-width="3"/><rect x="778" y="125" width="128" height="34" rx="9" fill="#64748b" fill-opacity=".18" stroke="#64748b" stroke-opacity=".55"/><text x="842.0" y="148.5" text-anchor="middle" font-size="18" font-weight="700" fill="#94a3b8">Submitted</text><text x="918" y="148.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" fill="#93a2bd">25-Aug-2026</text><circle cx="756" cy="188" r="7" fill="#0e1524" stroke="#22d3ee" stroke-width="3"/><rect x="778" y="171" width="128" height="34" rx="9" fill="#0891b2" fill-opacity=".18" stroke="#0891b2" stroke-opacity=".55"/><text x="842.0" y="194.5" text-anchor="middle" font-size="18" font-weight="700" fill="#22d3ee">With editor</text><text x="918" y="194.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" fill="#93a2bd">26-Aug-2026</text><circle cx="756" cy="234" r="7" fill="#0e1524" stroke="#60a5fa" stroke-width="3"/><rect x="778" y="217" width="128" height="34" rx="9" fill="#2563eb" fill-opacity=".18" stroke="#2563eb" stroke-opacity=".55"/><text x="842.0" y="240.5" text-anchor="middle" font-size="18" font-weight="700" fill="#60a5fa">In review</text><text x="918" y="240.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" fill="#93a2bd">01-Sep-2026</text><rect x="728" y="258" width="396" height="44" rx="10" fill="#d97706" fill-opacity=".10"/><circle cx="756" cy="280" r="7" fill="#0e1524" stroke="#fbbf24" stroke-width="3"/><rect x="778" y="263" width="128" height="34" rx="9" fill="#d97706" fill-opacity=".18" stroke="#d97706" stroke-opacity=".55"/><text x="842.0" y="286.5" text-anchor="middle" font-size="18" font-weight="700" fill="#fbbf24">Revision</text><text x="918" y="286.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" fill="#e6edf7">20-Nov-2026</text>

  <g filter="url(#sh)">
    <rect x="664" y="340" width="474" height="72" rx="16" fill="#111a2e" stroke="#7dd3fc" stroke-opacity=".38"/>
  </g>
  <circle cx="702" cy="376" r="20" fill="url(#brand)"/>
  <path d="M702 364.5c-5 0-8 3.6-8 8.2v4.6l-2.6 3.6h21.2l-2.6-3.6v-4.6c0-4.6-3-8.2-8-8.2zm-3 17.8a3 3 0 0 0 6 0" fill="#fff"/>
  <text x="736" y="370" font-size="20" font-weight="700" fill="#f8fafc">TPAMI status changed: Revision</text>
  <text x="736" y="397" font-size="18" fill="#93a2bd">Under Review → Major Revision · 2h ago</text>
</g>
</svg>
