# mituan 投稿追踪官网：tracker.eonmaze.com（纯静态，Cloudflare 代理）
# 放到 /etc/nginx/sites-available/manuscript-tracker.conf，再软链到 sites-enabled。
# Cloudflare 只把 https 回源到 8443（Origin Rule：tracker.eonmaze.com and ssl）；http 回源到 80。
# 80 端口：证书续期的 ACME 验证（webroot /var/www/acme，与服务器上其他站点一致），其余跳转到 https。
server {
    listen 80;
    listen [::]:80;
    server_name tracker.eonmaze.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name tracker.eonmaze.com;

    ssl_certificate     /etc/letsencrypt/live/tracker.eonmaze.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tracker.eonmaze.com/privkey.pem;

    root /var/www/manuscript-tracker;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Cloudflare Web Analytics：Cloudflare 自动注入统计脚本，脚本从 static.cloudflareinsights.com 加载，数据发到 cloudflareinsights.com
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
        expires 10m;
    }
    location /download/ {
        expires -1;
        types { application/zip zip; }
    }
}
